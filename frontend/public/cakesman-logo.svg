<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer circle border -->
  <circle cx="100" cy="100" r="98" fill="#F5E6D3" stroke="#8B6914" stroke-width="4"/>
  <circle cx="100" cy="100" r="92" fill="#FFFEF9" stroke="#D4AF37" stroke-width="2"/>
  
  <!-- Inner background -->
  <circle cx="100" cy="100" r="88" fill="#FFFEF9"/>
  
  <!-- Sky/background color -->
  <ellipse cx="100" cy="70" rx="70" ry="45" fill="#A8D8EA"/>
  
  <!-- Chef hat -->
  <ellipse cx="100" cy="45" rx="32" ry="18" fill="#F5F5F5" stroke="#333" stroke-width="1.5"/>
  <rect x="70" y="28" width="60" height="18" fill="#F5F5F5" stroke="#333" stroke-width="1.5"/>
  <ellipse cx="100" cy="28" rx="30" ry="12" fill="#FFFFFF" stroke="#333" stroke-width="1.5"/>
  
  <!-- Chef's head -->
  <circle cx="100" cy="75" r="28" fill="#F4A460" stroke="#333" stroke-width="1.5"/>
  
  <!-- Chef's face -->
  <!-- Eyes -->
  <circle cx="92" cy="70" r="3" fill="#333"/>
  <circle cx="108" cy="70" r="3" fill="#333"/>
  
  <!-- Smile/mouth -->
  <path d="M 92 78 Q 100 82 108 78" stroke="#333" stroke-width="2" fill="none" stroke-linecap="round"/>
  
  <!-- Nose -->
  <line x1="100" y1="72" x2="100" y2="76" stroke="#333" stroke-width="1.5" stroke-linecap="round"/>
  
  <!-- Chef's body/chef coat -->
  <ellipse cx="100" cy="110" rx="20" ry="25" fill="#FFFFFF" stroke="#333" stroke-width="1.5"/>
  
  <!-- Buttons on chef coat -->
  <circle cx="98" cy="105" r="2" fill="#333"/>
  <circle cx="102" cy="105" r="2" fill="#333"/>
  <circle cx="98" cy="115" r="2" fill="#333"/>
  <circle cx="102" cy="115" r="2" fill="#333"/>
  
  <!-- Left arm -->
  <ellipse cx="80" cy="105" rx="12" ry="18" fill="#F4A460" stroke="#333" stroke-width="1.5" transform="rotate(-30 80 105)"/>
  
  <!-- Right arm holding cake -->
  <ellipse cx="120" cy="105" rx="12" ry="18" fill="#F4A460" stroke="#333" stroke-width="1.5" transform="rotate(30 120 105)"/>
  
  <!-- Cake being held -->
  <g transform="translate(135, 75)">
    <!-- Cake base (bottom layer) -->
    <rect x="-15" y="25" width="30" height="18" fill="#8B4513" stroke="#333" stroke-width="1"/>
    <ellipse cx="0" cy="25" rx="15" ry="4" fill="#A0522D" stroke="#333" stroke-width="1"/>
    
    <!-- Frosting on bottom layer -->
    <path d="M -15 25 Q -12 20 -8 22 Q -4 20 0 22 Q 4 20 8 22 Q 12 20 15 25" fill="#D2691E" stroke="#8B4513" stroke-width="0.5"/>
    
    <!-- Middle layer -->
    <rect x="-12" y="8" width="24" height="17" fill="#A0522D" stroke="#333" stroke-width="1"/>
    <ellipse cx="0" cy="8" rx="12" ry="3" fill="#CD853F" stroke="#333" stroke-width="1"/>
    
    <!-- Frosting on middle layer -->
    <path d="M -12 8 Q -10 3 -6 5 Q -2 3 0 5 Q 2 3 6 5 Q 10 3 12 8" fill="#D2691E" stroke="#8B4513" stroke-width="0.5"/>
    
    <!-- Top layer -->
    <rect x="-9" y="-8" width="18" height="16" fill="#8B4513" stroke="#333" stroke-width="1"/>
    <ellipse cx="0" cy="-8" rx="9" ry="3" fill="#A0522D" stroke="#333" stroke-width="1"/>
    
    <!-- Frosting on top layer -->
    <path d="M -9 -8 Q -7 -13 -3 -11 Q 0 -13 3 -11 Q 7 -13 9 -8" fill="#D2691E" stroke="#8B4513" stroke-width="0.5"/>
    
    <!-- Crown on top -->
    <g transform="translate(0, -12)">
      <path d="M -5 0 L -3 -8 L 0 -6 L 3 -8 L 5 0 Z" fill="#FFD700" stroke="#DAA520" stroke-width="0.5"/>
      <circle cx="-3" cy="-8" r="1.5" fill="#FF69B4"/>
      <circle cx="0" cy="-6" r="1.5" fill="#FF69B4"/>
      <circle cx="3" cy="-8" r="1.5" fill="#FF69B4"/>
    </g>
  </g>
  
  <!-- Text: CAKESMAN (top arc) -->
  <defs>
    <path id="topArc" d="M 40 100 A 60 60 0 0 1 160 100" fill="none"/>
  </defs>
  <text font-family="Georgia, serif" font-size="24" font-weight="bold" fill="#8B4513" letter-spacing="2">
    <textPath href="#topArc" startOffset="50%" text-anchor="middle">
      CAKESMAN
    </textPath>
  </text>
  
  <!-- Text: BAKERY (bottom arc) -->
  <defs>
    <path id="bottomArc" d="M 160 100 A 60 60 0 0 1 40 100" fill="none"/>
  </defs>
  <text font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#8B4513" letter-spacing="1">
    <textPath href="#bottomArc" startOffset="50%" text-anchor="middle">
      BAKERY
    </textPath>
  </text>
  
  <!-- Decorative stars -->
  <g fill="#FFD700" opacity="0.7">
    <circle cx="30" cy="100" r="3"/>
    <circle cx="170" cy="100" r="3"/>
  </g>
</svg>